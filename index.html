dal-content img{height:42dvh}.details{padding:28px}.details h2{font-size:30px;margin:15px 0}.nav{margin-top:20px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

ite}.caption .date{color:#d0d3d9;font-size:9px}.caption .heart,.open{display:none!important}.note{text-align:left;margin:30px 0 45px}.ending{display:none}dialog{background:#191b1f;width:min(1200px,96vw);border:1px solid #363b43;border-radius:14px}dialog::backdrop{background:#000e}.modal-content{grid-template-columns:minmax(0,1fr) 320px}.modal-content img{height:78dvh;object-fit:contain;background:#08090a}.details{padding:55px 26px;align-self:start}.details h2{font-family:inherit;font-size:25px;line-height:1.4}.details p{color:#aeb4bd}.close{background:#30343b;color:white}.nav button{border-color:#4a505c;color:#c3d2ff;border-radius:8px}.empty{grid-column:1/-1;padding:50px 0;color:#aaa}.download{color:#b2c5ff}@media(min-width:1500px){.gallery{grid-template-columns:repeat(5,minmax(0,1fr))}}@media(max-width:950px){main{margin-left:0;padding:0 20px}.sidebar{display:none}.gallery{grid-template-columns:repeat(3,minmax(0,1fr))}.card img{height:190px!important}}@media(max-width:600px){header{padding:17px}.brand{font-size:17px}header a:last-child{font-size:10px;padding:9px 12px}.hero{padding-top:28px}.hero h1{font-size:26px}.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}.card img{height:170px!important}.tabs{gap:6px}.tabs button{font-size:11px;margin:0;padding:8px 10px}.modal-content{display:block}.modal-content img{height:48dvh}.details{padding:24px}.month{font-size:14px}.card .caption{display:none}}

/* Galeria imersiva: fotos desde a primeira tela */
header{position:relative;background:#111315;padding:17px 22px;border:0}.sidebar,.hero,.toolbar,.month{display:none}main{margin:0;padding:0 4px;max-width:none}.gallery{grid-template-columns:repeat(5,minmax(0,1fr));grid-auto-flow:dense;gap:4px}.card{border-radius:2px;aspect-ratio:1;min-width:0}.photo{width:100%;height:100%}.card img{width:100%;height:100%!important;object-fit:cover}.card:nth-of-type(6n+3){grid-column:span 2;grid-row:span 2}.card .caption{display:none}.card:hover img{transform:scale(1.025);filter:brightness(1.08)}.note{padding:20px;margin:0;font-size:11px}dialog{background:#17191eea;border:1px solid #ffffff20;box-shadow:0 30px 120px #0009;width:min(1180px,94vw);border-radius:18px;max-height:92dvh}dialog[open]{animation:appear .24s ease-out}dialog::backdrop{background:#080a10a6;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}.modal-content img{height:82dvh;background:#08090b;object-fit:contain}.details{align-self:center}.details .date{font-size:11px;line-height:1.8}.close{z-index:4;background:#292c36e6}.nav{gap:10px}.nav button{font-size:12px}.modal-content{grid-template-columns:minmax(0,1fr) 320px}@keyframes appear{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}@media(max-width:950px){main{padding:0 3px}.gallery{grid-template-columns:repeat(4,minmax(0,1fr));gap:3px}.card img{height:100%!important}}@media(max-width:600px){header{padding:16px 14px}.brand{font-size:17px}.gallery{grid-template-columns:repeat(3,minmax(0,1fr));gap:3px}.card img{height:100%!important}.modal-content{display:block}.modal-content img{height:52dvh;max-height:none}.details{padding:22px 24px 28px}.details h2{font-size:23px;margin:12px 0}.details p{font-size:13px;line-height:1.7}.note{padding:25px 12px}dialog{width:94vw;max-height:92dvh}.close{position:sticky;float:right;margin:12px 12px -47px 0;top:12px}.nav{margin-top:20px}}

#modalTitle,#modalStory,#modalCategory{display:none}.modal-content{display:block}.modal-content img{height:72dvh;width:100%;object-fit:contain}.details{padding:12px 24px 20px}.details p:empty,.details .date:empty{display:none}.nav{margin-top:12px}.nav button{min-width:110px}@media(max-width:600px){.modal-content img{height:65dvh}.details{padding:10px 18px 18px}}

</style></head><body><header><a class="brand" href="#"><span class="heart">♡</span> Amanda e David</a></header><aside class="sidebar"><a href="#album">▧ &nbsp; Todas as fotos</a><p>Os nossos dias,<br>do nosso jeito.<br><br>♡</p></aside><main><section class="hero"><h1>Nossa galeria</h1><p>Cada foto, um lugar para voltar.</p><input class="search" id="search" type="search" aria-label="Buscar fotos" placeholder="Buscar momentos, lugares ou datas..."></section><section id="album" aria-label="Álbum de lembranças"><div class="toolbar"><div class="tabs" aria-label="Filtrar lembranças"><button class="active" data-filter="Todas" aria-pressed="true">Todas</button><button data-filter="Viagens" aria-pressed="false">Viagens</button><button data-filter="Nós dois" aria-pressed="false">Nós dois</button><button data-filter="Pequenos momentos" aria-pressed="false">Pequenos momentos</button></div><span class="count" id="count"></span></div><div class="gallery" id="gallery"></div><p class="note">Amanda e David · Nossos instantes ♡</p></section><footer class="ending"><span class="heart">♡</span><p>E ainda temos tanto para viver.</p><small>FEITO PARA GUARDAR O QUE A GENTE SENTE.</small></footer></main><dialog id="memory" aria-label="Foto ampliada"><button class="close" aria-label="Fechar lembrança">×</button><div class="modal-content"><img id="modalImage" alt=""><div class="details"><span class="eyebrow" id="modalCategory"></span><h2 id="modalTitle"></h2><span class="date" id="modalDate"></span><p id="modalPlace"></p><p id="modalStory"></p><div class="nav"><button id="previous" aria-label="Lembrança anterior">← Anterior</button><button id="next" aria-label="Próxima lembrança">Próxima →</button></div></div></div></dialog><script>
const memories=[["Amanda e David · Foto 1", "", "", "Nós dois", "", "fotos/foto-01.jpg", 360], ["Amanda e David · Foto 2", "", "", "Nós dois", "", "fotos/foto-02.png", 360], ["Amanda e David · Foto 3", "", "", "Nós dois", "", "fotos/foto-03.jpg", 360], ["Amanda e David · Foto 4", "", "", "Nós dois", "", "fotos/foto-04.jpg", 360], ["Amanda e David · Foto 5", "", "", "Nós dois", "", "fotos/foto-05.jpg", 360]];
memories.forEach(m=>m.splice(2,0,null));
const imageUrl=m=>m[6];const formatDate=d=>!d?'':new Date(d+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});memories.sort((a,b)=>b[1].localeCompare(a[1]));let filtered=memories,index=0;const gallery=document.querySelector('#gallery'),dialog=document.querySelector('dialog');
function render(){gallery.replaceChildren();let lastMonth='';if(!filtered.length){const empty=document.createElement('p');empty.className='empty';empty.textContent='Nenhuma lembrança encontrada. Tente outra busca.';gallery.append(empty)}filtered.forEach((m,i)=>{const month=m[1].slice(0,7);if(month&&month!==lastMonth){const h=document.createElement('h2');h.className='month';h.textContent=new Date(m[1]+'T12:00:00').toLocaleDateString('pt-BR',{month:'long',year:'numeric'});gallery.append(h);lastMonth=month}const b=document.createElement('button');b.className='card';b.setAttribute('aria-label','Abrir lembrança: '+m[0]);const photo=document.createElement('div');photo.className='photo';const img=document.createElement('img');img.src=imageUrl(m);img.alt=m[0];img.loading='lazy';img.style.height=m[7]+'px';const arrow=document.createElement('span');arrow.className='open';arrow.textContent='↗';photo.append(img,arrow);const caption=document.createElement('div');caption.className='caption';const text=document.createElement('div');const title=document.createElement('h2');title.textContent=m[0];const date=document.createElement('span');date.className='date';date.textContent=formatDate(m[1]);text.append(title,date);const heart=document.createElement('span');heart.className='heart';heart.textContent='♡';caption.append(text,heart);b.append(photo,caption);b.onclick=()=>{index=i;show();dialog.showModal();document.body.style.overflow='hidden'};gallery.append(b)});document.querySelector('#count').textContent=filtered.length+' lembranças para revisitar'}
function show(){const m=filtered[index];document.querySelector('#modalImage').src=imageUrl(m);document.querySelector('#modalImage').alt=m[0];document.querySelector('#modalTitle').textContent=m[0];document.querySelector('#modalCategory').textContent=m[4];document.querySelector('#modalDate').textContent=formatDate(m[1]);document.querySelector('#modalPlace').textContent=m[3]?'⌖ '+m[3]:'';document.querySelector('#modalStory').textContent=m[5]||'A história deste momento será adicionada em breve.'}
let category='Todas';function applyFilters(){const q=document.querySelector('#search').value.toLocaleLowerCase('pt-BR').normalize('NFD').replace(/[\u0300-\u036f]/g,'');filtered=memories.filter(m=>(category==='Todas'||m[4]===category)&&[m[0],m[1],m[3],m[4],formatDate(m[1])].join(' ').toLocaleLowerCase('pt-BR').normalize('NFD').replace(/[\u0300-\u036f]/g,'').includes(q));render()}document.querySelector('#search').addEventListener('input',applyFilters);document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{category=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-pressed',String(x===b))});applyFilters()});document.querySelector('.close').onclick=()=>dialog.close();dialog.addEventListener('close',()=>document.body.style.overflow='');dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()}});document.querySelector('#previous').onclick=()=>{index=(index-1+filtered.length)%filtered.length;show()};document.querySelector('#next').onclick=()=>{index=(index+1)%filtered.length;show()};dialog.addEventListener('keydown',e=>{if(e.key==='ArrowRight')document.querySelector('#next').click();if(e.key==='ArrowLeft')document.querySelector('#previous').click()});render();
</script></body></html>
